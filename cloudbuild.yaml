# Google Cloud Build – CI/CD pipeline for Cloud Run
# Triggered automatically on every push to main branch

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/yojana-sarthi-backend:$COMMIT_SHA'
      - '--tag'
      - 'gcr.io/$PROJECT_ID/yojana-sarthi-backend:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/yojana-sarthi-backend:latest'
      - '.'
    timeout: '1200s'

  # Step 2: Push image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'gcr.io/$PROJECT_ID/yojana-sarthi-backend'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'yojana-sarthi-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/yojana-sarthi-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '120'
      - '--set-env-vars'
      # CASHFREE_ENV and LLM_MODEL are NOT secrets – plain env vars (free, no Secret Manager slot used)
      - 'CASHFREE_ENV=sandbox,LLM_MODEL=gemini-2.5-flash'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest,SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_KEY=SUPABASE_KEY:latest,SUPABASE_SERVICE_KEY=SUPABASE_SERVICE_KEY:latest,CASHFREE_CLIENT_ID=CASHFREE_CLIENT_ID:latest,CASHFREE_CLIENT_SECRET=CASHFREE_CLIENT_SECRET:latest'
    secretEnv:
      - 'GEMINI_API_KEY'
      - 'SUPABASE_URL'
      - 'SUPABASE_KEY'
      - 'SUPABASE_SERVICE_KEY'
      - 'CASHFREE_CLIENT_ID'
      - 'CASHFREE_CLIENT_SECRET'

# Store image in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/yojana-sarthi-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/yojana-sarthi-backend:latest'

# Build timeout (ML model download takes time)
timeout: '1800s'

# Secret env vars from Google Secret Manager (exactly 6 = free tier)
availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: 'GEMINI_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_URL/versions/latest
      env: 'SUPABASE_URL'
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_KEY/versions/latest
      env: 'SUPABASE_KEY'
    - versionName: projects/$PROJECT_ID/secrets/SUPABASE_SERVICE_KEY/versions/latest
      env: 'SUPABASE_SERVICE_KEY'
    - versionName: projects/$PROJECT_ID/secrets/CASHFREE_CLIENT_ID/versions/latest
      env: 'CASHFREE_CLIENT_ID'
    - versionName: projects/$PROJECT_ID/secrets/CASHFREE_CLIENT_SECRET/versions/latest
      env: 'CASHFREE_CLIENT_SECRET'
    # CASHFREE_ENV ('sandbox') and LLM_MODEL are plain env vars – not stored as secrets
